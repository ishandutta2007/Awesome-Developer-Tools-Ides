<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: #334155;
      stroke-width: 1;
      stroke-opacity: 0.18;
    }
    .orbit-circle {
      fill: none;
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
      animation: rotateRing 30s linear infinite;
      transform-origin: 980px 180px;
    }
    .flow-line {
      fill: none;
      stroke-dasharray: 8 12;
      animation: dashFlow 12s linear infinite;
    }
    .floating-card {
      animation: floatMotion 6s ease-in-out infinite alternate;
    }
    .pulse-pill {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatMotion {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      100% { opacity: 0.85; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Orbs in Background (behind content) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#neonGlow)" />
  <circle cx="1020" cy="220" r="160" fill="#a855f7" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="650" cy="300" r="120" fill="#ec4899" opacity="0.07" filter="url(#neonGlow)" />

  <!-- Flowing Dynamic Data / Toolchain Pathways in Background -->
  <path class="flow-line" d="M 500,280 C 700,280 800,100 1150,110" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" />
  <path class="flow-line" d="M 420,310 C 650,330 850,220 1180,240" stroke="#818cf8" stroke-width="2" opacity="0.35" style="animation-duration: 9s;" />

  <!-- Orbital Rings on Right Flank -->
  <g opacity="0.6">
    <circle class="orbit-circle" cx="980" cy="180" r="110" stroke="#6366f1" />
    <circle class="orbit-circle" cx="980" cy="180" r="75" stroke="#38bdf8" style="animation-duration: 20s; animation-direction: reverse;" />
    <circle cx="980" cy="180" r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <!-- Center IDE Icon symbol -->
    <path d="M 972,171 L 965,180 L 972,189 M 988,171 L 995,180 L 988,189 M 983,168 L 977,192" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Dynamic Interactive Tool Cards on the Right Side (Non-obstructing) -->
  <g class="floating-card" transform="translate(850, 48)">
    <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadowFilter)" />
    <circle cx="22" cy="21" r="7" fill="#38bdf8" />
    <text x="38" y="26" class="badge-text">⚡ SwiftPM &amp; Native</text>
  </g>

  <g class="floating-card" transform="translate(930, 268)" style="animation-delay: -3s;">
    <rect width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadowFilter)" />
    <circle cx="22" cy="21" r="7" fill="#c084fc" />
    <text x="38" y="26" class="badge-text">🛠️ Cross-Platform SDKs</text>
  </g>

  <!-- FOREGROUND: Clear Title, Subtitle, and Core Value Metrics -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" class="pulse-pill" />
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#shadowFilter)">
      Awesome Developer Tools &amp; IDEs
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1">
      Native Compilation • Cross-Platform Toolchains • Platform-Specific SDKs
    </text>

    <!-- Terminal Prompt Line Feature -->
    <g transform="translate(0, 222)">
      <rect width="530" height="36" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1" />
      <text x="14" y="23" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="13" fill="#38bdf8">&gt;</text>
      <text x="32" y="23" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="13" fill="#e2e8f0">curated-ecosystem --track SaaS --track OpenSource</text>
      <rect x="445" y="11" width="8" height="15" fill="#38bdf8" class="cursor-blink" />
    </g>

    <!-- Foreground Metric Pills -->
    <g transform="translate(0, 282)">
      <!-- Pill 1 -->
      <g>
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🚀 SaaS Leaders</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">⭐ 500k+ OSS Stars</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(315, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🌐 Multi-Platform</text>
      </g>
    </g>
  </g>
</svg>